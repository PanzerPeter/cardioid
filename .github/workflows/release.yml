name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner sets the glibc floor, so the binary runs on
    # older distros too. GUI libraries are loaded at runtime, not linked.
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          name="cardioid-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$name/assets"
          cp "target/$TARGET/release/cardioid" install.sh README.md LICENSE "$name/"
          cp assets/cardioid.svg "$name/assets/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
